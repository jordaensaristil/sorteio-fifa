workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 30  # Aumentei um pouco para garantir tempo suficiente
    environment:
      vars:
        PACKAGE_NAME: "com.seunome.sorteiofifa"
      node: 20.5.0           # Versão estável recomendada para Capacitor
    scripts:
      - npm install -g @ionic/cli
      - npm cache clean --force
      - npm ci
      - npm run build
      # Se você NÃO comita a pasta android no repo, precisa adicionar android aqui:
      - npx cap add android || echo "Android platform already added"
      - npx cap sync android
      - cd android
      - chmod +x gradlew        # Garante que o gradlew tem permissão de execução no Linux/macOS
      - ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
