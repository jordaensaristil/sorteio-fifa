workflows:
  build_android:
    name: Build Android com Cordova
    environment:
      node: 20.5.0
      java: 11
      android: true
    scripts:
      - name: Instalar dependências
        script: |
          npm install
      - name: Build Vue para Cordova
        script: |
          npm run build
      - name: Preparar Cordova
        script: |
          cd cordova
          npx cordova platform add android || echo "Android já adicionado"
      - name: Build Cordova Android
        script: |
          cd cordova
          npx cordova build android --no-interactive
    artifacts:
      - cordova/platforms/android/app/build/outputs/**/*.apk
