workflows:
  build_android:
    name: Build Android App (Vue + Capacitor)
    environment:
      node: 18.20.2
      java: 11
      vars:
        PACKAGE_NAME: "com.seuapp.nome"  # Substitua pelo seu ID do app
    scripts:
      - name: Instalar dependências
        script: |
          npm install
      - name: Build do Vue
        script: |
          npm run build
      - name: Sincronizar Capacitor
        script: |
          npx cap sync android
      - name: Build Android com Gradle
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
