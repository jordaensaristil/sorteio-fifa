workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 20
    environment:
      vars:
        PACKAGE_NAME: "com.seunome.sorteiofifa"
      node: 22.17.1
    scripts:
      - npm install -g @ionic/cli
      - npm install
      - npx cap sync android
      - cd android
      - ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
