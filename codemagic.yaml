workflows:
  build_android:
    name: Build Android App (Vue + Capacitor)
    environment:
      node: 20.5.0
      java: 11
      vars:
        PACKAGE_NAME: "com.seuapp.nome"
    scripts:
      - name: Instalar dependências
        script: |
          npm install
      - name: Corrigir permissões dos binários locais
        script: |
          chmod +x node_modules/.bin/vite
          chmod +x node_modules/.bin/cap
      - name: Build do Vue
        script: |
          npm run build
      - name: Sincronizar Capacitor
        script: |
          npx cap sync android
      - name: Build Android com Gradle
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
